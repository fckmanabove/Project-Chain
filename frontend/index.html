      // Защита от 503: автоматическая нормализация путей для прокси code-server
      if (window.location.pathname.match(/\/(proxy|absproxy)\/\d+$/)) {
        window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
      }
